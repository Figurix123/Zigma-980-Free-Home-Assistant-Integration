# Sparky map-first dashboard for Home Assistant.
#
# Before importing, replace every `replace_me` entity ID below with the
# corresponding entity ID from your own Zigma Free device. This file is a
# dashboard template; HACS does not install Lovelace dashboards automatically.
# The four action buttons use the community `button-card` resource.

views:
  - title: Sparky
    path: overview
    icon: mdi:robot-vacuum
    type: sections
    max_columns: 2
    badges:
      - type: entity
        entity: vacuum.replace_me_vacuum
        name: Betrieb
        show_name: true
        show_state: true
      - type: entity
        entity: sensor.replace_me_battery
        name: Akku
        show_name: true
        show_state: true
      - type: entity
        entity: sensor.replace_me_telemetry
        name: Datenstand
        icon: mdi:cloud-sync-outline
        show_name: true
        show_state: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Live-Karte
            heading_style: title
            icon: mdi:map-outline
          - type: picture-elements
            camera_image: camera.replace_me_map
            camera_view: live
            aspect_ratio: "164.7%"
            dark_mode_filter: "invert(0.92) hue-rotate(180deg)"
            grid_options:
              columns: full
              rows: auto
            elements:
              - type: custom:button-card
                entity: button.replace_me_pause
                name: Pause
                icon: mdi:pause
                show_icon: true
                show_name: true
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.replace_me_pause
                styles:
                  card:
                    - width: 96px
                    - height: 40px
                    - padding: 0 10px
                    - border-radius: 22px
                    - border: 1px solid rgba(255, 255, 255, 0.20)
                    - background: rgba(24, 32, 40, 0.90)
                    - box-shadow: 0 4px 14px rgba(0, 0, 0, 0.20)
                  grid:
                    - grid-template-areas: '"i n"'
                    - grid-template-columns: 20px 1fr
                    - grid-template-rows: 1fr
                    - column-gap: 5px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: "#ffd27a"
                  name:
                    - justify-self: center
                    - color: white
                    - font-size: 12px
                    - font-weight: 600
                style:
                  top: 12px
                  right: 114px
                  left: auto
                  transform: none
                  width: 96px
                  height: 40px
              - type: custom:button-card
                entity: button.replace_me_dock
                name: Dock
                icon: mdi:home-map-marker
                show_icon: true
                show_name: true
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.replace_me_dock
                  confirmation:
                    text: Sparky zurück zur Ladestation schicken?
                styles:
                  card:
                    - width: 96px
                    - height: 40px
                    - padding: 0 10px
                    - border-radius: 22px
                    - border: 1px solid rgba(255, 255, 255, 0.20)
                    - background: rgba(24, 32, 40, 0.90)
                    - box-shadow: 0 4px 14px rgba(0, 0, 0, 0.20)
                  grid:
                    - grid-template-areas: '"i n"'
                    - grid-template-columns: 20px 1fr
                    - grid-template-rows: 1fr
                    - column-gap: 5px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: "#b4e7d4"
                  name:
                    - justify-self: center
                    - color: white
                    - font-size: 12px
                    - font-weight: 600
                style:
                  top: 12px
                  right: 12px
                  left: auto
                  transform: none

      - type: grid
        cards:
          - type: heading
            heading: Steuerung
            heading_style: title
            icon: mdi:gesture-tap
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                entity: button.replace_me_clean
                name: Reinigen
                label: Neue Reinigung
                icon: mdi:robot-vacuum
                show_icon: true
                show_name: true
                show_label: true
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.replace_me_clean
                  confirmation:
                    text: Sparky jetzt mit der gewählten Saugstärke starten?
                hold_action:
                  action: more-info
                styles:
                  card:
                    - height: 142px
                    - padding: 16px
                    - border-radius: 22px
                    - border: 1px solid rgba(255, 255, 255, 0.35)
                    - "background: linear-gradient(145deg, #118477, #17614f)"
                    - box-shadow: 0 8px 22px rgba(17, 100, 83, 0.20)
                  grid:
                    - grid-template-areas: '"i" "n" "l"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: 42px min-content min-content
                    - row-gap: 3px
                  icon:
                    - width: 30px
                    - color: white
                  name:
                    - justify-self: start
                    - color: white
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - color: rgba(255, 255, 255, 0.82)
                    - font-size: 12px
              - type: custom:button-card
                entity: button.replace_me_resume
                name: Fortsetzen
                label: Reinigung weiterführen
                icon: mdi:play-circle-outline
                show_icon: true
                show_name: true
                show_label: true
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.replace_me_resume
                hold_action:
                  action: more-info
                styles:
                  card:
                    - height: 142px
                    - padding: 16px
                    - border-radius: 22px
                    - border: 1px solid rgba(255, 255, 255, 0.35)
                    - "background: linear-gradient(145deg, #397ad0, #28549a)"
                    - box-shadow: 0 8px 22px rgba(42, 89, 155, 0.18)
                  grid:
                    - grid-template-areas: '"i" "n" "l"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: 42px min-content min-content
                    - row-gap: 3px
                  icon:
                    - width: 30px
                    - color: white
                  name:
                    - justify-self: start
                    - color: white
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - color: rgba(255, 255, 255, 0.84)
                    - font-size: 12px
              - type: custom:button-card
                entity: button.replace_me_pause
                name: Pause
                label: Reinigung anhalten
                icon: mdi:pause-circle-outline
                show_icon: true
                show_name: true
                show_label: true
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.replace_me_pause
                hold_action:
                  action: more-info
                styles:
                  card:
                    - height: 142px
                    - padding: 16px
                    - border-radius: 22px
                    - border: 1px solid rgba(255, 255, 255, 0.35)
                    - "background: linear-gradient(145deg, #d99134, #a85b18)"
                    - box-shadow: 0 8px 22px rgba(173, 105, 32, 0.18)
                  grid:
                    - grid-template-areas: '"i" "n" "l"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: 42px min-content min-content
                    - row-gap: 3px
                  icon:
                    - width: 30px
                    - color: white
                  name:
                    - justify-self: start
                    - color: white
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - color: rgba(255, 255, 255, 0.86)
                    - font-size: 12px
              - type: custom:button-card
                entity: button.replace_me_dock
                name: Zur Station
                label: Zur Ladestation fahren
                icon: mdi:home-map-marker
                show_icon: true
                show_name: true
                show_label: true
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.replace_me_dock
                  confirmation:
                    text: Sparky zurück zur Ladestation schicken?
                hold_action:
                  action: more-info
                styles:
                  card:
                    - height: 142px
                    - padding: 16px
                    - border-radius: 22px
                    - border: 1px solid rgba(255, 255, 255, 0.35)
                    - "background: linear-gradient(145deg, #596a83, #354156)"
                    - box-shadow: 0 8px 22px rgba(51, 65, 85, 0.20)
                  grid:
                    - grid-template-areas: '"i" "n" "l"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: 42px min-content min-content
                    - row-gap: 3px
                  icon:
                    - width: 30px
                    - color: white
                  name:
                    - justify-self: start
                    - color: white
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - color: rgba(255, 255, 255, 0.84)
                    - font-size: 12px
          - type: tile
            entity: select.replace_me_suction_power
            name: Saugstärke · nächster Start
            icon: mdi:fan
            features:
              - type: select-options
                style: dropdown
            grid_options:
              columns: full
          - type: tile
            entity: number.replace_me_speaker_volume
            name: Lautstärke
            icon: mdi:volume-high
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: full

  - title: Details
    path: details
    icon: mdi:chart-box-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Betriebsdaten
            heading_style: title
            icon: mdi:chart-box-outline
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.replace_me_native_error
                name: Fehlercode
                icon: mdi:alert-circle-outline
              - type: tile
                entity: sensor.replace_me_cleaning_time
                name: Reinigungszeit
                icon: mdi:timer-outline

      - type: grid
        cards:
          - type: heading
            heading: Zeitpläne
            heading_style: title
            icon: mdi:calendar-clock
          - type: tile
            entity: sensor.replace_me_schedules
            name: Auf dem Roboter gespeichert
            icon: mdi:calendar-check-outline
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Zeitpläne aktivieren oder pausieren
              show_header_toggle: false
            filter:
              include:
                - integration: zigma_free
                  domain: switch
            sort:
              method: name
              ignore_case: true
          - type: markdown
            entity_id: sensor.replace_me_schedules
            text_only: true
            content: >-
              {% set jobs = state_attr('sensor.replace_me_schedules', 'schedules') or [] %}
              {% if jobs %}
              {% for job in jobs %}
              - **{{ job.label | default('Zeitplan ' ~ loop.index) }}** · {{ job.time | default('Uhrzeit unbekannt') }} · {{ 'Aktiv' if job.enabled else 'Pausiert' }}
              {% endfor %}
              {% else %}
              Noch keine Zeitpläne vorhanden. Lege sie in der Roboter-App an; unterstützte Zeitpläne erscheinen anschließend hier.
              {% endif %}
