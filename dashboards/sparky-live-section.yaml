# Add this section under a view's `sections:` list on your main dashboard.
# Replace every `replace_me` entity ID with the matching entity in your HA.
# It is hidden while the robot is docked, paused, or idle.
- type: grid
  column_span: 2
  visibility:
    - condition: or
      conditions:
        - condition: state
          entity: vacuum.replace_me_vacuum
          state: cleaning
        - condition: state
          entity: vacuum.replace_me_vacuum
          state: returning
  cards:
    - type: heading
      heading: Sparky live
      heading_style: title
      icon: mdi:robot-vacuum
      grid_options:
        columns: full
    - type: picture-elements
      camera_image: camera.replace_me_map
      camera_view: live
      aspect_ratio: "164.7%"
      dark_mode_filter: "invert(0.92) hue-rotate(180deg)"
      grid_options:
        columns: 12
        rows: auto
      elements:
        - type: custom:button-card
          entity: button.replace_me_pause
          name: Pause
          icon: mdi:pause
          show_icon: true
          show_name: true
          show_state: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.replace_me_pause
          styles:
            card:
              - width: 96px
              - height: 40px
              - padding: 0 10px
              - border-radius: 22px
              - border: 1px solid rgba(255, 255, 255, 0.20)
              - background: rgba(24, 32, 40, 0.90)
              - box-shadow: 0 4px 14px rgba(0, 0, 0, 0.20)
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: 20px 1fr
              - grid-template-rows: 1fr
              - column-gap: 5px
              - align-items: center
            icon:
              - width: 18px
              - color: "#ffd27a"
            name:
              - justify-self: center
              - color: white
              - font-size: 12px
              - font-weight: 600
          style:
            top: 12px
            right: 114px
            left: auto
            transform: none
            width: 96px
            height: 40px
        - type: custom:button-card
          entity: button.replace_me_dock
          name: Dock
          icon: mdi:home-map-marker
          show_icon: true
          show_name: true
          show_state: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.replace_me_dock
            confirmation:
              text: Sparky zurück zur Ladestation schicken?
          styles:
            card:
              - width: 96px
              - height: 40px
              - padding: 0 10px
              - border-radius: 22px
              - border: 1px solid rgba(255, 255, 255, 0.20)
              - background: rgba(24, 32, 40, 0.90)
              - box-shadow: 0 4px 14px rgba(0, 0, 0, 0.20)
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: 20px 1fr
              - grid-template-rows: 1fr
              - column-gap: 5px
              - align-items: center
            icon:
              - width: 18px
              - color: "#b4e7d4"
            name:
              - justify-self: center
              - color: white
              - font-size: 12px
              - font-weight: 600
          style:
            top: 12px
            right: 12px
            left: auto
            transform: none
            width: 96px
            height: 40px
    - type: grid
      columns: 1
      square: false
      grid_options:
        columns: 12
        rows: auto
      cards:
        - type: tile
          entity: vacuum.replace_me_vacuum
          name: Status
          icon: mdi:robot-vacuum
        - type: tile
          entity: sensor.replace_me_battery
          name: Akku
          icon: mdi:battery
        - type: tile
          entity: sensor.replace_me_cleaning_time
          name: Zeit
          icon: mdi:timer-outline
